# 第一层 CI：托管 runner 上就能跑，不需要游戏安装。
#   Tools/Verify-Static.ps1        文本与脚本的一致性检查（不需要 .NET SDK）
#   Tools/Test-BuildWorkflow.ps1   构建/验证/打包入口的离线回归（不需要 .NET SDK）
#   Tools/Test-OfflineProjects.ps1 4 个离线测试工程（需要 .NET 10 SDK）
#
# 已知缺口允许清单在 Tools/Verify-Static.ps1 的 $KnownDebt 里：那些位置只提示、不判失败；
# 修完删条目后，对应规则立刻变成硬失败。
name: repo-checks

on:
  pull_request:
  push:
    branches: [main, keep_branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: 静态与一致性检查
    runs-on: windows-latest
    steps:
      # 先关掉行尾自动转换：Verify-Static.ps1 里的文档镜像检查按文件字节比对，
      # 必须保证 CI 拿到的就是仓库里的字节，否则同一份提交在不同机器上结果不同。
      - name: 关闭行尾自动转换
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 提交范围检查需要 PR base 这个提交

      # 只有最后的离线测试工程需要 SDK；静态检查本身不需要，装它不影响前面的检查。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 静态检查（PowerShell 7）
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force -ErrorAction SilentlyContinue
          ./Tools/Verify-Static.ps1

      # 同一份规则要在 Windows PowerShell 5.1 上也跑一遍：仓库里的 .ps1 同时被 5.1 调用，
      # 而 5.1 在非 UTF-8 代码页下对缺 BOM 的 UTF-8 中文脚本会乱码甚至解析失败。
      - name: 静态检查（Windows PowerShell 5.1）
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./Tools/Verify-Static.ps1

      - name: 提交范围检查（仅 PR）
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./Tools/Verify-Static.ps1 -BaseRevision "${{ github.event.pull_request.base.sha }}"

      - name: 构建入口回归（PowerShell 7）
        shell: pwsh
        run: ./Tools/Test-BuildWorkflow.ps1

      - name: 构建入口回归（Windows PowerShell 5.1）
        shell: powershell
        run: ./Tools/Test-BuildWorkflow.ps1

      # Mods/RimUnity 交换的崩溃窗口自测：不启动游戏、不碰真实安装。
      - name: 交换状态恢复回归（PowerShell 7）
        shell: pwsh
        run: ./Tools/Test-ModsSwap.ps1

      - name: 交换状态恢复回归（Windows PowerShell 5.1）
        shell: powershell
        run: ./Tools/Test-ModsSwap.ps1

      # 4 个不需要游戏、不需要 Unity 的测试工程。RenderDiagnosticsTests 需要
      # <RimUnity.dll> <游戏目录> <0Harmony.dll> 三个参数，只能在第二层跑。
      - name: 离线测试工程
        shell: pwsh
        run: ./Tools/Test-OfflineProjects.ps1
